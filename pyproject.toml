[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "treska"
version = "1.0.2"
description = "Fast forensic parser for zipped logical extractions in CTF competitions. by ShadowStrike."
readme = "README.md"
license = {text = "MIT"}
authors = [
  {name = "ShadowStrike"},
]
requires-python = ">=3.11"
dependencies = [
    # Both ship the `magic` module — never install together.
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
treska = "treska.cli:main"
treska-web = "treska.web.main:main"

[project.urls]
"Source" = "https://github.com/ShadowStrike-CTF/treska"

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/treska"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
